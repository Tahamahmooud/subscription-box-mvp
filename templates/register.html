{% extends "base.html" %}
{% block title %}إنشاء حساب - صندوقي{% endblock %}
{% block content %}
<div class="container my-5" style="max-width: 450px;">
    <div class="card shadow">
        <div class="card-body p-4">
            <h3 class="text-center mb-4"><i class="bi bi-box-seam"></i> حساب جديد</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">الاسم الكامل</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">رقم الجوال</label>
                    <input type="tel" name="phone" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">المدينة</label>
                    <input type="text" name="city" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary w-100">إنشاء حساب</button>
            </form>
            <hr>
            <p class="text-center mb-0">لديك حساب؟ <a href="{{ url_for('login') }}">سجل دخولك</a></p>
        </div>
    </div>
</div>
{% endblock %}
